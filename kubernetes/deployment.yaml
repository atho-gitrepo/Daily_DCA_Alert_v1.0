# ============================================================
# DCA Day Trading Bot - Kubernetes Deployment
# Version: 1.0.0
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dca-trading-bot
  namespace: trading
  labels:
    app: dca-trading-bot
    version: v1.0.0
    environment: development
spec:
  replicas: 1  # Keep at 1 for local development
  selector:
    matchLabels:
      app: dca-trading-bot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dca-trading-bot
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: dca-bot
        image: dca-trading-bot:latest
        imagePullPolicy: IfNotPresent  # Changed to use local image
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: dca-trading-config
        - secretRef:
            name: dca-trading-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      volumes:
      - name: logs
        emptyDir: {}  # Use emptyDir for local development
      - name: data
        emptyDir: {}  # Use emptyDir for local development
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      terminationGracePeriodSeconds: 30
    
