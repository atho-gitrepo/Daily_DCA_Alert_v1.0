# ============================================================
# DCA Day Trading Bot - Kubernetes Service (Simplified)
# Version: 1.0.0
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: dca-trading-bot
  namespace: trading
  labels:
    app: dca-trading-bot
    version: v1.0.0
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: NodePort  # Changed from ClusterIP for local access
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
    nodePort: 30080  # Accessible via http://localhost:30080
  selector:
    app: dca-trading-bot

---
# Headless service for internal discovery
apiVersion: v1
kind: Service
metadata:
  name: dca-trading-bot-headless
  namespace: trading
  labels:
    app: dca-trading-bot
spec:
  clusterIP: None
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: dca-trading-bot
